
name: My First GitHub Actions CI

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML file
        run: test -f index.html
        
      - name: Intentional failure test
        run: |
          echo "Testing failure handling..."
          exit 1


      - name: Print success
        run: echo "My first GitHub Actions workflow is working!"
